<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLGK Web &amp; App Developers</title>
    
    <meta name="description" content="Attractive web &amp; app development made easy on a low budget. Try it now...">
    <link rel="canonical" href="https://slgk.lk/">
    <link rel="shortcut icon" href="slgk.png" type="image/x-icon">

    <!-- Meta Refresh for Instant Redirect -->
    <meta http-equiv="refresh" content="0; url=https://slgk.lk">

    <!-- Open Graph Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slgk.lk/">
    <meta property="og:title" content="SLGK Web &amp; App Developers">
    <meta property="og:description" content="Attractive web &amp; app development made easy on a low budget. Try it now...">
    <meta property="og:site_name" content="SLGK">
    
    <!-- Image served directly from GitHub Pages to bypass InfinityFree blocks -->
    <meta property="og:image" content="http://info.slgk.lk/slgk.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="497">
    <meta property="og:image:height" content="502">
    <meta property="og:image:alt" content="SLGK – Sri Lanka's Trusted Online Platform">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SLGK Web &amp; App Developers">
    <meta name="twitter:description" content="Attractive web &amp; app development made easy on a low budget. Try it now...">
    <meta name="twitter:image" content="http://info.slgk.lk/slgk.png">
    <meta name="twitter:image:alt" content="SLGK – Sri Lanka's Trusted Online Platform">

    <style>
      #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column; /* Stacks spinner above text */
        justify-content: center;
        align-items: center;
        gap: 15px;
        z-index: 99999;
      }
      
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #0052cc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      p {
        text-align: center;
        color: #000000;
        text-transform: capitalize;
        font-weight: bold;
        font-size: large;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        margin: 0;
      }
    </style>

    <!-- Fallback JavaScript Redirect -->
    <script>
        window.location.href = "https://slgk.lk";
    </script>
  </head>
  <body>
    <div id="page-loader">
      <div class="spinner"></div>
      <p>Redirecting to SLGK... If not redirected, <a href="https://slgk.lk">click here</a>.</p>
    </div>
  </body>
</html>
